name: Web CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - name: Use pinned npm
        run: npm install --global npm@12.0.1
      - name: Install locked dependencies
        run: npm ci
      - name: Check web client
        run: npm run check
